apiVersion: v1
kind: ConfigMap
metadata:
  name: pico-build-worker-android
  labels:
    app.kubernetes.io/name: pico-build-worker
    app.kubernetes.io/component: android-worker
data:
  NODE_ENV: production
  WORKER_PLATFORM: android
  QUEUE_NAME: pico-builds
  WORKER_CONCURRENCY: "1"
  WORKSPACE_ROOT: /tmp/pico-builds
  BUILD_TIMEOUT_MS: "1800000"
  LOG_FLUSH_BYTES: "262144"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pico-build-worker-android
  labels:
    app.kubernetes.io/name: pico-build-worker
    app.kubernetes.io/component: android-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pico-build-worker
      app.kubernetes.io/component: android-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pico-build-worker
        app.kubernetes.io/component: android-worker
    spec:
      serviceAccountName: pico-build-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/ne0k1r4/pico-build-worker-android:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pico-build-worker-android
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pico-build-worker
                  key: redis-url
            - name: ARTIFACT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: pico-build-worker
                  key: artifact-bucket
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: pico-build-worker
                  key: s3-region
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: pico-build-worker
                  key: s3-endpoint
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 30Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: workspace
              mountPath: /tmp/pico-builds
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 40Gi
